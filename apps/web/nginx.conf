server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # SPA fallback — same reason apps/web/vercel.json needed a rewrite:
        # BrowserRouter serves real paths (/inventory, /requests, ...) that
        # don't exist as files, so every unmatched path falls back to the
        # app shell and React Router takes over client-side.
        try_files $uri /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
