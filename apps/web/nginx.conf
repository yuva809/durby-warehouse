server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite content-hashes every built asset filename (index-<hash>.js), so
    # once a file is served its content can never change under that name —
    # safe to cache forever. index.html is the opposite: it's what points at
    # the current hash, so it must never be cached, or a browser can keep
    # running a stale build (with a stale bundle referencing old/removed API
    # shapes) until it happens to hard-refresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # SPA fallback — same reason apps/web/vercel.json needed a rewrite:
        # BrowserRouter serves real paths (/inventory, /requests, ...) that
        # don't exist as files, so every unmatched path falls back to the
        # app shell and React Router takes over client-side.
        try_files $uri /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
