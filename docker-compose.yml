name: durby-warehouse

services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Bare domain (no scheme) for production -> Caddy auto-provisions a
      # real Let's Encrypt cert. Defaults include "http://" explicitly so
      # local dev serves plain HTTP with no TLS at all (see infra/Caddyfile).
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-http://localhost}
      API_DOMAIN: ${API_DOMAIN:-http://api.localhost}
    depends_on:
      - frontend
      - backend
    networks: [public, internal]

  frontend:
    build:
      context: ./apps/web
      args:
        # Baked into the JS bundle at build time — see apps/web/Dockerfile.
        # Defaults match the Caddyfile's local-dev domains; override in .env
        # for a real deployment (e.g. https://api.warehouse.example.com/api).
        VITE_API_URL: ${VITE_API_URL:-http://api.localhost/api}
        # Dev/demo convenience only (Login page's quick-login list) — set to
        # an empty/unused value for a real deployment; nothing else reads it.
        VITE_SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-ChangeMe123!}
        # Defaults on for local dev. MUST be set to "false" in .env before a
        # real deployment — see DEPLOY.md's production checklist.
        VITE_SHOW_DEMO_LOGINS: ${VITE_SHOW_DEMO_LOGINS:-true}
    restart: unless-stopped
    expose: ["80"]
    networks: [internal]

  backend:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-only-redis-password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost}
      # Docker service discovery, not a hardcoded host/IP — see
      # apps/api/src/supplier-invoices/ocr-client.service.ts.
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_started
    expose: ["3000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Loopback-only (see postgres/redis notes below) — lets a standalone
    # `npm run dev` frontend (hot reload, not through Caddy) reach the API
    # directly during development. Host side mapped to 3001, not 3000,
    # since 3000 is a very common dev-server port that's often already
    # taken by an unrelated project on the same machine; the container
    # still listens on 3000 internally (Caddy reaches it as `backend:3000`,
    # unaffected by this host-side choice).
    ports:
      - "127.0.0.1:3001:3000"

  # Same image as `backend`, different entrypoint — see apps/api/src/worker.ts.
  # Deliberately one process for both queues rather than a second worker
  # service, per "avoid unnecessary workers/microservices."
  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-only-redis-password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # PaddleOCR fallback for scanned/image-only supplier invoice PDFs (see
  # apps/api/src/supplier-invoices/parsers/pdf.parser.ts, which only ever
  # calls this when pdf-parse's own text layer is insufficient). A separate
  # Python service, not a NestJS module, because PaddleOCR/PaddlePaddle are
  # Python-only — this is the one place in the stack where that's true.
  # Internal-only: no public `ports:`, reachable from backend/worker purely
  # via Docker service discovery (OCR_SERVICE_URL=http://ocr:8000).
  ocr:
    build:
      context: ./apps/ocr
    # PaddlePaddle's CPU inference genuinely crashes (SIGSEGV, confirmed by
    # actually running it — not assumed) on native linux/arm64, which is
    # what Docker Desktop builds by default on an Apple Silicon dev machine.
    # x86_64 is paddlepaddle's primary, fully-supported platform: pinning it
    # here makes local dev run it under Docker Desktop's built-in emulation
    # (slower per-OCR-call, acceptable for a fallback path that isn't in
    # the common request path) while Hetzner — an ordinary x86_64 VPS —
    # runs it natively with no emulation and no performance cost at all.
    platform: linux/amd64
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Loopback-only, same reasoning as postgres/redis below — lets a
    # developer curl it directly from the host machine for debugging; never
    # reachable from outside this machine, let alone the internet.
    ports:
      - "127.0.0.1:8001:8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No top-level `ports:` mapping — reachable only from other containers on
    # the `internal` network, never from the host network or the internet.
    # Loopback-only host mapping below, for local dev tooling (psql, Prisma
    # Studio) on the same machine — comment out for the VPS if you don't need
    # host-side DB access there. Mapped to host port 5433 (not 5432) because
    # a native/Homebrew Postgres commonly already owns 5432 on developer
    # machines; containers still talk to this one as `postgres:5432`
    # internally, unaffected by this host-side port choice.
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Always requires a password — defense-in-depth against a future
    # port-mapping mistake exposing this to the internet with no auth (a
    # very common real-world Redis misconfiguration). The local-dev default
    # below is a fixed, non-secret placeholder so nothing extra is needed
    # to run `docker compose up` locally; set a real random REDIS_PASSWORD
    # in .env for production, same pattern as POSTGRES_PASSWORD/JWT_SECRET.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-dev-only-redis-password}"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local-dev-only-redis-password}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Same loopback-only reasoning as postgres above.
    ports:
      - "127.0.0.1:6379:6379"

networks:
  public:
  internal:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
